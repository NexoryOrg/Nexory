name: Discord Notifications

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, closed, reopened, edited]
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review_comment:
    types: [created, edited, deleted]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:

      - name: Build push embed
        id: build_push
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import json, os, requests

          GITHUB_TOKEN = os.environ.get('GITHUB_TOKEN', '')
          headers = {"Authorization": f"token {GITHUB_TOKEN}"}

          ev = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          repo = ev.get('repository', {})
          repo_name = repo.get('full_name', '')
          head = ev.get('head_commit', {})

          # Default values
          added, removed, modified = [], [], []
          total_additions = 0
          total_deletions = 0
          description = head.get('message', '')

          sha = head.get('id')
          if sha:
              url = f"https://api.github.com/repos/{repo_name}/commits/{sha}"
              r = requests.get(url, headers=headers)
              if r.ok:
                  data = r.json()
                  stats = data.get("stats", {})
                  total_additions = stats.get("additions", 0)
                  total_deletions = stats.get("deletions", 0)
                  files = data.get("files", [])

                  for f in files:
                      status = f.get("status")
                      filename = f.get("filename")
                      if status == "added":
                          added.append(filename)
                      elif status == "removed":
                          removed.append(filename)
                      else:
                          modified.append(filename)

          def format_files(files, limit=10):
              files_list = files[:limit]
              out = "\n".join(f"`{f}`" for f in files_list)
              if len(files) > limit:
                  out += f"\n+ `{len(files)-limit} more files`"
              return out or "None"

          data = [{
              "title": f"Push to {os.environ.get('GITHUB_REF_NAME','')}",
              "description": f"Comment (`{head.get('id','')}`):\n{head.get('message','')}",
              "color": 3447003,
              "author": {
                  "name": os.environ.get('GITHUB_ACTOR',''),
                  "url": f"https://github.com/{os.environ.get('GITHUB_ACTOR','')}",
                  "icon_url": f"https://github.com/{os.environ.get('GITHUB_ACTOR','')}.png"
              },
              "fields": [
                  {"name": "Changed Files", "value": format_files(modified), "inline": False},
                  {"name": "Added Files", "value": format_files(added), "inline": True},
                  {"name": "Removed Files", "value": format_files(removed), "inline": True},
                  {"name": "Additions", "value": str(total_additions), "inline": True},
                  {"name": "Deletions", "value": str(total_deletions), "inline": True}
              ],
              "footer": {"text": os.environ.get('GITHUB_REPOSITORY','')}
          }]

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('embeds<<EOF\n')
              f.write(json.dumps(data))
              f.write('\nEOF\n')
          PY

      - name: Notify push
        if: github.event_name == 'push'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_EMBEDS: ${{ steps.build_push.outputs.embeds }}

      - name: Build pull request embed
        id: build_pr
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          import json, os

          ev = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          pr = ev.get('pull_request', {})
          user = pr.get('user', {})
          action = ev.get('action')

          if action in ["opened", "reopened"]:
              color = 3066993
          elif action == "closed":
              color = 15158332
          else:
              color = 9807270

          data = [{
              "title": f"Pull Request #{pr.get('number')}",
              "description": pr.get('title',''),
              "color": color,
              "author": {
                  "name": user.get('login',''),
                  "url": f"https://github.com/{user.get('login','')}",
                  "icon_url": f"https://github.com/{user.get('login','')}.png"
              },
              "fields": [
                  {"name": "Action", "value": action, "inline": True},
                  {"name": "Branch", "value": pr.get("head", {}).get("ref",""), "inline": True}
              ],
              "url": pr.get('html_url',''),
              "footer": {"text": os.environ.get('GITHUB_REPOSITORY','')}
          }]

          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('embeds<<EOF\n')
              f.write(json.dumps(data))
              f.write('\nEOF\n')
          PY

      - name: Notify pull request
        if: github.event_name == 'pull_request'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: ${{ steps.build_pr.outputs.embeds }}

      - name: Build issue embed
        id: build_issue
        if: github.event_name == 'issues'
        shell: bash
        run: |
          python - <<'PY'
          import json, os

          ev = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          issue = ev.get('issue', {})
          user = issue.get('user', {})
          action = ev.get('action')

          if action in ["opened", "reopened"]:
              color = 3066993
          elif action == "closed":
              color = 15158332
          else:
              color = 9807270

          data = [{
              "title": f"Issue #{issue.get('number')}",
              "description": issue.get('title',''),
              "color": color,
              "author": {
                  "name": user.get('login',''),
                  "url": f"https://github.com/{user.get('login','')}",
                  "icon_url": f"https://github.com/{user.get('login','')}.png"
              },
              "fields": [
                  {"name": "Action", "value": action, "inline": True}
              ],
              "url": issue.get('html_url',''),
              "footer": {"text": os.environ.get('GITHUB_REPOSITORY','')}
          }]

          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('embeds<<EOF\n')
              f.write(json.dumps(data))
              f.write('\nEOF\n')
          PY

      - name: Notify issue
        if: github.event_name == 'issues'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: ${{ steps.build_issue.outputs.embeds }}

      - name: Build issue comment embed
        id: build_issue_comment
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          python - <<'PY'
          import json, os

          ev = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          comment = ev.get('comment', {})
          issue = ev.get('issue', {})
          user = comment.get('user', {})

          data = [{
              "title": f"Comment on Issue #{issue.get('number','')} ",
              "description": comment.get('body',''),
              "color": 9807270,
              "author": {
                  "name": user.get('login',''),
                  "url": f"https://github.com/{user.get('login','')}",
                  "icon_url": f"https://github.com/{user.get('login','')}.png"
              },
              "url": comment.get('html_url',''),
              "footer": {"text": os.environ.get('GITHUB_REPOSITORY','')}
          }]

          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('embeds<<EOF\n')
              f.write(json.dumps(data))
              f.write('\nEOF\n')
          PY

      - name: Notify issue comment
        if: github.event_name == 'issue_comment'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: ${{ steps.build_issue_comment.outputs.embeds }}

      - name: Notify PR review comment
        if: github.event_name == 'pull_request_review_comment'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: |
            [
              {
                "title": "PR Review Comment",
                "description": "${{ github.event.comment.body }}",
                "color": 9807270,
                "author": {
                  "name": "${{ github.event.comment.user.login }}",
                  "url": "https://github.com/${{ github.event.comment.user.login }}",
                  "icon_url": "https://github.com/${{ github.event.comment.user.login }}.png"
                },
                "url": "${{ github.event.comment.html_url }}",
                "footer": { "text": "${{ github.repository }}" }
              }
            ]