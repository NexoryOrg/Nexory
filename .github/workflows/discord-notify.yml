name: Discord Notifications

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, closed, reopened, merged]
  issues:
    types: [opened, edited, closed, reopened, deleted]
  discussion:
    types: [created, edited, closed, reopened, deleted]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review_comment:
    types: [created, edited, deleted]
  discussion_comment:
    types: [created, edited, deleted]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify push
        if: github.event_name == 'push'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: >-
            ${{ toJson([{
              title: '🚀 Push to ' + github.ref_name,
              description: 'Author: ' + github.actor,
              color: 3447003,
              fields: [
                { name: 'Commit', value: github.event.head_commit.id, inline: true },
                { name: 'Message', value: github.event.head_commit.message, inline: false }
              ],
              timestamp: github.event.head_commit.timestamp
            }]) }}
        with:
          args: ""

      - name: Notify pull request
        if: github.event_name == 'pull_request'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: >-
            ${{ toJson([{
              title: '🛠 Pull Request #' + github.event.number,
              description: github.event.pull_request.title,
              color: 3066993,
              fields: [
                { name: 'Action', value: github.event.action, inline: true },
                { name: 'User', value: github.event.pull_request.user.login, inline: true }
              ],
              url: github.event.pull_request.html_url
            }]) }}
        with:
          args: ""

      - name: Notify issue
        if: github.event_name == 'issues'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: >-
            ${{ toJson([{
              title: '🐛 Issue #' + github.event.issue.number,
              description: github.event.issue.title,
              color: 15105570,
              fields: [
                { name: 'Action', value: github.event.issue.action, inline: true },
                { name: 'User', value: github.event.issue.user.login, inline: true }
              ],
              url: github.event.issue.html_url
            }]) }}
        with:
          args: ""

      - name: Notify discussion
        if: github.event_name == 'discussion'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: >-
            ${{ toJson([{
              title: '💬 Discussion',
              description: github.event.discussion.title,
              color: 10181046,
              fields: [
                { name: 'Action', value: github.event.action, inline: true }
              ],
              url: github.event.discussion.html_url
            }]) }}
        with:
          args: ""

      - name: Notify issue comment
        if: github.event_name == 'issue_comment'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: >-
            ${{ toJson([{
              title: '💬 Comment on Issue #' + github.event.issue.number,
              description: github.event.comment.body,
              color: 9807270,
              fields: [
                { name: 'User', value: github.event.comment.user.login, inline: true }
              ],
              url: github.event.comment.html_url
            }]) }}
        with:
          args: ""

      - name: Notify PR review comment
        if: github.event_name == 'pull_request_review_comment'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: >-
            ${{ toJson([{
              title: '📝 PR Review Comment',
              description: github.event.comment.body,
              color: 16766720,
              fields: [
                { name: 'PR', value: '#' + github.event.pull_request.number, inline: true },
                { name: 'User', value: github.event.comment.user.login, inline: true }
              ],
              url: github.event.comment.html_url
            }]) }}
        with:
          args: ""

      - name: Notify discussion comment
        if: github.event_name == 'discussion_comment'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: >-
            ${{ toJson([{
              title: '💬 Discussion Comment',
              description: github.event.comment.body,
              color: 3447003,
              fields: [
                { name: 'Discussion', value: github.event.discussion.title, inline: false },
                { name: 'User', value: github.event.comment.user.login, inline: true }
              ],
              url: github.event.comment.html_url
            }]) }}
        with:
          args: ""
