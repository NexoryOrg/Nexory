name: Discord Notifications

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, closed, reopened, merged]
  issues:
    types: [opened, edited, closed, reopened, deleted]
  discussion:
    types: [created, edited, closed, reopened, deleted]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review_comment:
    types: [created, edited, deleted]
  discussion_comment:
    types: [created, edited, deleted]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify push
        if: github.event_name == 'push'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            🚀 Push to ${{ github.ref_name }}
            Author: ${{ github.actor }}
            Commit: ${{ github.event.head_commit.id }}
            Message: ${{ github.event.head_commit.message }}

      - name: Notify pull request
        if: github.event_name == 'pull_request'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: PR #${{ github.event.number }} "${{ github.event.pull_request.title }}" was ${{ github.event.action }}

      - name: Notify issue
        if: github.event_name == 'issues'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: Issue #${{ github.event.issue.number }} "${{ github.event.issue.title }}" was ${{ github.event.issue.action }}

      - name: Notify discussion
        if: github.event_name == 'discussion'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: Discussion "${{ github.event.discussion.title }}" was ${{ github.event.action }}

      - name: Notify issue comment
        if: github.event_name == 'issue_comment'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: Comment on issue #${{ github.event.issue.number }} by ${{ github.event.comment.user.login }}

      - name: Notify PR review comment
        if: github.event_name == 'pull_request_review_comment'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: Comment on PR #${{ github.event.pull_request.number }} by ${{ github.event.comment.user.login }}

      - name: Notify discussion comment
        if: github.event_name == 'discussion_comment'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: Comment on discussion "${{ github.event.discussion.title }}" by ${{ github.event.comment.user.login }}
