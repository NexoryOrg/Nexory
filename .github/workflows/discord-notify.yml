name: Discord Notifications

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, closed, reopened, merged]
  issues:
    types: [opened, edited, closed, reopened, deleted]
  discussion:
    types: [created, edited, closed, reopened, deleted]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review_comment:
    types: [created, edited, deleted]
  discussion_comment:
    types: [created, edited, deleted]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Discord
        uses: Ilshidur/action-discord@v2
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          message: |
            ${{ github.event_name }} event in `${{ github.repository }}`

            {% if github.event_name == 'push' %}
            🚀 Push to `${{ github.ref_name }}`
            Author: `${{ github.actor }}`
            Commit: `${{ github.event.head_commit.id }}`
            Message: `${{ github.event.head_commit.message }}`
            {% elif github.event_name == 'pull_request' %}
            PR #${{ github.event.number }} `${{ github.event.pull_request.title }}` was `${{ github.event.action }}`
            {% elif github.event_name == 'issues' %}
            Issue #${{ github.event.issue.number }} `${{ github.event.issue.title }}` was `${{ github.event.action }}`
            {% elif github.event_name == 'discussion' %}
            Discussion `${{ github.event.discussion.title }}` was `${{ github.event.action }}`
            {% elif github.event_name == 'issue_comment' %}
            Comment on issue #${{ github.event.issue.number }} by `${{ github.event.comment.user.login }}`
            {% elif github.event_name == 'pull_request_review_comment' %}
            Comment on PR #${{ github.event.pull_request.number }} by `${{ github.event.comment.user.login }}`
            {% elif github.event_name == 'discussion_comment' %}
            Comment on discussion `${{ github.event.discussion.title }}` by `${{ github.event.comment.user.login }}`
            {% endif %}
